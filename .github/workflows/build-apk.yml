name: Build NeMoTalk APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Copy and rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/NeMoTalk-1.1.0.apk
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeMoTalk-1.1.0-APK
          path: dist/NeMoTalk-1.1.0.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.1.0"
          NOTES="NeMoTalk v1.1.0 — آوانمو: بازطراحی کامل ریسپانسیو و بهینه‌سازی موبایل + زنجیره خودکار Fallback برای مدل‌های ان‌ویدیا و رفع ارور ۴۰۴"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading asset..."
            gh release upload "$TAG_NAME" dist/NeMoTalk-1.1.0.apk --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" dist/NeMoTalk-1.1.0.apk --title "NeMoTalk v1.1.0 — آوانمو" --notes "$NOTES"
          fi
